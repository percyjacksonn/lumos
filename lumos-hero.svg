<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Lumos - a study material sharing portal. Find it. Save it. Study it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="card"><rect x="30" y="24" width="940" height="262" rx="30"/></clipPath>
    <style>
      .f{font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;font-weight:800}
    </style>
  </defs>

  <!-- offset shadow + card (same doodle look as the site) -->
  <rect x="42" y="36" width="940" height="262" rx="30" fill="#16110F"/>
  <rect x="30" y="24" width="940" height="262" rx="30" fill="#FFF8E1"/>

  <g clip-path="url(#card)">
    <circle cx="880" cy="50" r="115" fill="#FFC93C" opacity=".75">
      <animate attributeName="cx" values="880;850;880" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;80;50" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="275" r="95" fill="#3AACFF" opacity=".5">
      <animate attributeName="cx" values="105;140;105" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="275;245;275" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="310" r="70" fill="#F0523A" opacity=".18">
      <animate attributeName="r" values="70;90;70" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- floating study things -->
    <g transform="translate(110 70) rotate(-10)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -14;0 0" dur="4.2s" repeatCount="indefinite"/>
      <rect width="62" height="78" rx="9" fill="#fff" stroke="#16110F" stroke-width="4"/>
      <path d="M14 22h34M14 36h34M14 50h22" stroke="#F0523A" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(860 140) rotate(12)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -12;0 0" dur="3.6s" begin="-1s" repeatCount="indefinite"/>
      <path d="M0 -26 L8 -8 L28 -6 L13 7 L18 27 L0 16 L-18 27 L-13 7 L-28 -6 L-8 -8Z" fill="#FFC93C" stroke="#16110F" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g transform="translate(205 205) rotate(8)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -10;0 0" dur="4.8s" begin="-2s" repeatCount="indefinite"/>
      <path d="M-9 -30 V-8 L-30 24 Q-34 32 -26 32 H26 Q34 32 30 24 L9 -8 V-30" fill="#E1F5EC" stroke="#16110F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M-20 12 H20" stroke="#2FAE73" stroke-width="6" stroke-linecap="round"/>
      <path d="M-13 -30 H13" stroke="#16110F" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(905 232) rotate(-6) scale(.8)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -11;0 0" dur="5s" begin="-3s" repeatCount="indefinite"/>
      <path d="M0 0 H34 Q40 0 40 6 V50 Q40 56 34 56 H0 Z" fill="#3AACFF" stroke="#16110F" stroke-width="4" stroke-linejoin="round"/>
      <path d="M0 0 H-34 Q-40 0 -40 6 V50 Q-40 56 -34 56 H0 Z" fill="#fff" stroke="#16110F" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- wordmark -->
  <circle cx="365" cy="132" r="31" fill="#F0523A" stroke="#16110F" stroke-width="5"/>
  <circle cx="365" cy="132" r="9" fill="#fff"/>
  <path d="M365 101 A31 31 0 0 1 396 132" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 365 132;360 365 132" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="418" y="162" class="f" font-size="96" fill="#16110F" textLength="330" lengthAdjust="spacingAndGlyphs">lumos</text>
  <path d="M420 178 H760" stroke="#F0523A" stroke-width="7" stroke-linecap="round" stroke-dasharray="340 400" stroke-dashoffset="340">
    <animate attributeName="stroke-dashoffset" values="340;0;0;340" keyTimes="0;.25;.85;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- cycling tagline -->
  <g class="f" font-size="26" fill="#16110F" text-anchor="middle">
    <text x="500" y="232" opacity="0">Find it.  Save it.  Study it.
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.29;.33" dur="9s" begin="0s" repeatCount="indefinite"/></text>
    <text x="500" y="232" opacity="0">Notes · PYQs · Important Questions · Labs
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.29;.33" dur="9s" begin="3s" repeatCount="indefinite"/></text>
    <text x="500" y="232" opacity="0">Built by students, for students.
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.04;.29;.33" dur="9s" begin="6s" repeatCount="indefinite"/></text>
  </g>
</svg>
